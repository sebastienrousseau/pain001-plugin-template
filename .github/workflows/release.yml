# SPDX-License-Identifier: Apache-2.0 OR MIT
name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pipx install poetry==2.4.1
      - run: poetry check --lock
      - run: poetry install --no-interaction
      - run: poetry run make check sec
      - name: Build the complete source distribution
        run: |
          version=$(python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['tool']['poetry']['version'])")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p dist
          git archive --format=tar --prefix="pain001-plugin-template-${version}/" HEAD | gzip -n > "dist/pain001-plugin-template-${version}.tar.gz"
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Retain the candidate artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: dist/
      - name: Publish the source release and complete notes
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "pain001-plugin-template $VERSION" \
            --notes-file "releases/v${VERSION}.md"
          python scripts/release_notes.py publish --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" --project pain001-plugin-template
