name: ci
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: pipx install poetry==2.4.1
      - run: poetry check --lock
      - run: poetry install --all-extras --no-interaction
      - run: poetry run make check
      - run: poetry run make sec

  check-all:
    # Branch protection requires this check by name. It stands for every
    # leg of the check matrix, so adding or dropping a version never
    # renames a required check.
    name: check (all)
    if: always()
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every leg of the matrix passed
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success
